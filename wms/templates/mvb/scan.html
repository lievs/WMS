{% extends "mvb/base.html" %}
{% block title %}{{ mode_info.title }}{% endblock %}
{% block content %}
<h3 class="mb-3">📷 {{ mode_info.title }}</h3>
<p class="text-muted">Сканируйте каждый короб — статус станет «{{ MVB_BOX_STATUS_LABELS[mode_info.to] }}».</p>
<div class="input-group input-group-lg mb-3" style="max-width:560px">
  <input id="mvbScanInput" class="form-control" placeholder="Штрихкод короба" autocomplete="off" autofocus>
  <button type="button" class="btn btn-outline-success" data-camera-scan-target="#mvbScanInput" title="Сканировать камерой">📷</button>
</div>
<div id="mvbScanLast" class="mb-3"></div>
<h6>Отсканировано в этой сессии: <span id="mvbScanCount">0</span></h6>
<ul id="mvbScanLog" class="list-group" style="max-width:720px"></ul>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const input = document.getElementById("mvbScanInput");
  const last = document.getElementById("mvbScanLast");
  const log = document.getElementById("mvbScanLog");
  const countEl = document.getElementById("mvbScanCount");
  let count = 0;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

  async function send(code) {
    const body = new URLSearchParams({barcode: code});
    let data;
    try {
      const resp = await fetch("{{ url_for('mvb.scan_box', mode=mode) }}", {method: "POST", body});
      data = await resp.json();
    } catch (e) {
      data = {ok: false, message: "Нет связи с сервером"};
    }
    const cls = !data.ok ? "danger" : data.already ? "warning" : "success";
    const orderPart = data.order
      ? ` · <a href="${esc(data.order_url)}">${esc(data.order)}</a> · ${esc(data.client)} · короб ${esc(data.seq)}/${esc(data.total)}` +
        (data.done !== undefined ? ` · по заявке: ${esc(data.done)} из ${esc(data.total)}` : "")
      : "";
    last.innerHTML = `<div class="alert alert-${cls} fs-5 mb-0">${esc(data.message)}${orderPart}</div>`;
    if (data.ok && !data.already) {
      count += 1;
      countEl.textContent = count;
    }
    const li = document.createElement("li");
    li.className = `list-group-item list-group-item-${cls}`;
    li.innerHTML = `${esc(code)} — ${esc(data.message)}`;
    log.prepend(li);
    if (navigator.vibrate) navigator.vibrate(data.ok ? 60 : [100, 60, 100]);
  }

  initBarcodeInput(input, send);
})();
</script>
{% endblock %}
